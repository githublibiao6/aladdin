spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB

  datasource:
    username: root
    password:
    url: jdbc:mysql://localhost:3306/sso?serverTimezone=UTC&characterEncoding=utf-8&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver


mybatis:
  mapper-locations: classpath*:/mybatis-mapper/**/*.xml
  type-aliases-package: com.aladdin.mis.entity
  configuration:
    map-underscore-to-camel-case: true

